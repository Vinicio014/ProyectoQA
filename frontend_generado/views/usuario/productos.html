<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Tienda</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">
                <i class="fas fa-tshirt"></i> Uniformes Deportivos
            </a>
            <div class="ms-auto">
                <a href="#" class="btn btn-light" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge bg-danger" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">Nuestros Productos</h1>
        
        <!-- Filtros -->
        <div class="row mb-4">
            <div class="col-md-3">
                <input type="text" class="form-control" id="buscarProducto" placeholder="Buscar...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filtroCategoria">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>

        <!-- Lista de productos -->
        <div id="productosLista" class="row">
            <!-- Productos cargados dinámicamente -->
        </div>
    </div>

    <!-- Modal del Carrito -->
    <div class="modal fade" id="carritoModal" tabindex="-1">
        <div class="modal-dialog cart-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Mi Carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="carritoContenido">
                    <!-- Contenido del carrito -->
                </div>
                <div class="modal-footer">
                    <div class="w-100">
                        <h4>Total: $<span id="totalCarrito">0.00</span></h4>
                        <button class="btn btn-primary w-100" onclick="procederPago()">
                            Proceder al Pago
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/usuario.js"></script>
</body>
</html>
