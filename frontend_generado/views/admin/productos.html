<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-sidebar {
            width: 250px;
            min-height: 100vh;
            background: #1e293b;
            color: white;
            padding: 2rem 1rem;
        }
        .admin-sidebar h3 {
            color: white;
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }
        .admin-sidebar nav a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .admin-sidebar nav a:hover {
            background: #334155;
            color: white;
        }
        .admin-sidebar nav a.active {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <h3><i class="fas fa-user-shield"></i> Administrador Sistema</h3>
            <nav>
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="productos.html" class="active"><i class="fas fa-box"></i> Productos</a>
                <a href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a>
                <a href="pedidos.html"><i class="fas fa-shopping-bag"></i> Pedidos</a>
                <a href="ventas.html"><i class="fas fa-tags"></i> Ventas</a>
                <hr>
                <a href="#" onclick="cerrarSesion(); return false;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </nav>
        </div>

        <!-- Contenido Principal -->
        <div class="flex-grow-1 p-4 bg-light">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1>Gestión de Productos</h1>
                    <p class="text-muted">Administra el catálogo de productos</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNuevoProducto()">
                    <i class="fas fa-plus"></i> Nuevo Producto
                </button>
            </div>

            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="buscarProducto" placeholder="Buscar por nombre, marca o descripción...">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" id="filtroCategoria">
                                <option value="">Todas las categorías</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-secondary w-100" onclick="limpiarFiltros()">
                                <i class="fas fa-times"></i> Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Marca</th>
                                    <th>Categoría</th>
                                    <th>Stock</th>
                                    <th>Precio</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Cargando...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProductoTitulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="productoId">
                        
                        <div class="mb-3">
                            <label for="productoNombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="productoNombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="productoMarca" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="productoMarca">
                        </div>

                        <div class="mb-3">
                            <label for="productoDescripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="productoDescripcion" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="productoCategoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                            <select class="form-select" id="productoCategoria" required>
                                <option value="">Seleccione una categoría</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="productoStock" class="form-label">Stock <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="productoStock" min="0" value="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="productoPrecio" class="form-label">Precio (Q) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="productoPrecio" min="0" step="0.01" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarProducto()">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (protegerPagina(true)) {
                cargarProductosAdmin();
                cargarCategoriasSelect();
                configurarFiltros();
            }
        });
    </script>
</body>
</html>
