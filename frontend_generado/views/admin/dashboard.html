<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-sidebar {
            width: 250px;
            min-height: 100vh;
            background: #1e293b;
            color: white;
            padding: 2rem 1rem;
        }
        .admin-sidebar h3 {
            color: white;
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }
        .admin-sidebar nav a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .admin-sidebar nav a:hover {
            background: #334155;
            color: white;
        }
        .admin-sidebar nav a.active {
            background: #3b82f6;
            color: white;
        }
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <h3><i class="fas fa-user-shield"></i> Admin Panel</h3>
            <nav>
                <a href="dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="productos.html"><i class="fas fa-box"></i> Productos</a>
                <a href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a>
                <a href="pedidos.html"><i class="fas fa-shopping-bag"></i> Pedidos</a>
                <a href="categorias.html"><i class="fas fa-tags"></i> Categorías</a>
                <hr>
                <a href="#" onclick="cerrarSesion(); return false;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </nav>
        </div>

        <!-- Contenido Principal -->
        <div class="flex-grow-1 p-4 bg-light">
            <div class="mb-4">
                <h1>Dashboard</h1>
                <p class="text-muted">Bienvenido al panel de administración</p>
            </div>
            
            <!-- Estadísticas -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body">
                            <h5>Total Productos</h5>
                            <h2 id="totalProductos">
                                <span class="spinner-border spinner-border-sm"></span>
                            </h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-success">
                        <div class="card-body">
                            <h5>Total Usuarios</h5>
                            <h2 id="totalUsuarios">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-warning">
                        <div class="card-body">
                            <h5>Pedidos Pendientes</h5>
                            <h2 id="pedidosPendientes">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-info">
                        <div class="card-body">
                            <h5>Ventas del Mes</h5>
                            <h2 id="ventasMes">Q0.00</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de últimos pedidos -->
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Últimos Pedidos</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Fecha</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPedidos">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">
                                        <i class="fas fa-inbox fa-3x mb-3"></i>
                                        <p>No hay pedidos recientes</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/admin.js"></script>
</body>
</html>
